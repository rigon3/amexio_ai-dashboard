<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amexio HR Dashboard — Home</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'DM Sans', sans-serif; }
    body { background: #F5F7FB; color: #1A1F36; display: flex; min-height: 100vh; }
    :root {
      --navy: #1B4965; --orange: #FF6B35; --orange-h: #FF7A45;
      --navy-acc: #2C5F7A; --bg: #F8F9FA; --card: #ffffff;
      --bg2: #F0F2F5; --border: #E0E4E8; --txt: #1A1F36;
      --txt2: #5F6B7A; --sidebar-w: 240px;
    }
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--navy);
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .sidebar-logo {
      padding: 1.5rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.3px;
    }
    .sidebar-logo span { color: var(--orange); }

    .sidebar-nav {
      flex: 1;
      padding: 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s;
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .nav-item:hover { background: var(--navy-acc); color: white; }
    .nav-item.active { background: var(--orange); color: white; }

    .sidebar-bottom {
      padding: 1rem 0.75rem 1.5rem;
    }
    .upload-btn {
      width: 100%;
      background: var(--orange);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: inherit;
      transition: background 0.15s;
    }
    .upload-btn:hover { background: var(--orange-h); }
    .main-content {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 1.5rem 2.4rem 2rem;
      overflow-y: auto;
    }
    .page-header { margin-bottom: 1.35rem; }
    h1 { font-size: 1.85rem; font-weight: 700; color: var(--txt); margin-bottom: 0.45rem; }
    .subtitle { font-size: 1rem; color: #5B6980; margin-bottom: 0; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 1.15rem;
      max-width: 1100px;
    }

    .metric-card {
      background: #fff;
      border: 1px solid rgba(212, 219, 229, 0.9);
      border-radius: 18px;
      padding: 1.35rem 1.45rem;
      box-shadow: 0 2px 4px rgba(16, 24, 40, 0.04), 0 12px 30px rgba(16, 24, 40, 0.05);
      min-height: 180px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .metric-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--orange);
    }

    .metric-head {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .metric-icon {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 60px;
    }

    .metric-icon svg { width: 28px; height: 28px; }

    .icon-sick { background: #FFF4E7; color: #FF6B35; }
    .icon-budget { background: #EEF5FF; color: #244C69; }
    .icon-employees { background: #EEF9F0; color: #00B13A; }

    .metric-label {
      font-size: 1rem;
      color: #50607A;
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: 0.45rem;
    }

    .metric-value {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      color: #0F1B34;
      letter-spacing: -0.04em;
      margin-bottom: 0.55rem;
    }

    .metric-copy {
      font-size: 1.08rem;
      color: #536178;
      line-height: 1.35;
    }

    .metric-foot {
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid #E7ECF3;
      color: #5B6980;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .metric-foot strong {
      color: #0F1B34;
      font-weight: 600;
    }

    .metric-sick::before { background: #FF6B35; }
    .metric-budget::before { background: #2F6BFF; }
    .metric-employees::before { background: #00B13A; }

    .loading-state, .error-state {
      margin-top: 1rem;
      padding: 0.95rem 1rem;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--txt2);
    }

    @media (max-width: 900px) {
      .main-content { padding: 1.25rem 1rem 1.5rem; }
      .dashboard-grid { max-width: none; }
      .metric-card { padding: 1.15rem 1rem; }
      .metric-head { flex-direction: column; }
    }
  </style>
</head>
<body data-page="home">
  <aside id="sidebar">
    <div class="sidebar-logo">
      <img src="Photo/AmexioPhoto.png" alt="Amexio" style="height:40px;width:100%;object-fit:contain;"/>
    </div>
    <nav class="sidebar-nav">
      <a href="Home.html" class="nav-item active">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
        Home
      </a>
      <a href="Employees.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Employees
      </a>
      <a href="SickLeave.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Sick Leave
      </a>
      <a href="training_budget.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        Training Budget
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="upload-btn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
        Upload Data
      </button>
    </div>
  </aside>
  <div class="main-content">
    <div class="page-header">
      <h1>HR Dashboard</h1>
      <p class="subtitle">Overview of key HR metrics and insights</p>
    </div>

    <div id="loading" class="loading-state">Loading dashboard metrics...</div>

    <section id="dashboard" class="dashboard-grid" hidden>
      <article class="metric-card metric-sick">
        <div class="metric-head">
          <div class="metric-icon icon-sick">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12h3l2-7 4 14 2-7h7" />
            </svg>
          </div>
          <div>
            <div class="metric-label">Sick Leave</div>
            <div class="metric-value" id="absent-count">-</div>
            <div class="metric-copy">employees currently absent</div>
          </div>
        </div>
        <div class="metric-foot">
          <span>Current absent</span>
          <strong id="absent-desc">-</strong>
        </div>
      </article>

      <article class="metric-card metric-budget">
        <div class="metric-head">
          <div class="metric-icon icon-budget">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 10l9-5 9 5-9 5-9-5z" />
              <path d="M7 12v5c0 1.7 3 3 5 3s5-1.3 5-3v-5" />
            </svg>
          </div>
          <div>
            <div class="metric-label">Training Budget</div>
            <div class="metric-value" id="budget-pct">-</div>
            <div class="metric-copy" id="budget-summary">-</div>
          </div>
        </div>
        <div>
          <div class="metric-foot">
            <span>Total amount</span>
            <strong id="budget-total">-</strong>
          </div>
          <div class="metric-foot">
            <span>Used amount</span>
            <strong id="budget-used">-</strong>
          </div>
        </div>
      </article>

      <article class="metric-card metric-employees">
        <div class="metric-head">
          <div class="metric-icon icon-employees">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            </svg>
          </div>
          <div>
            <div class="metric-label">Employees</div>
            <div class="metric-value" id="active-count">-</div>
            <div class="metric-copy">active employees</div>
          </div>
        </div>
        <div class="metric-foot">
          <span>Active headcount</span>
          <strong id="active-desc">-</strong>
        </div>
      </article>
    </section>

    <div id="error" class="error-state" hidden></div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000";

    const money = new Intl.NumberFormat("nl-NL", {
      style: "currency",
      currency: "EUR",
      maximumFractionDigits: 0,
    });

    const integer = new Intl.NumberFormat("nl-NL");

    function setText(id, value) {
      const element = document.getElementById(id);
      if (element) {
        element.textContent = value;
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Request failed for ${url} (${response.status})`);
      }
      return response.json();
    }

    async function loadDashboard() {
      try {
        const [budget, employees] = await Promise.all([
          fetchJson(`${API_URL}/data`),
          fetchJson(`${API_URL}/employees`),
        ]);

        const activeEmployees = employees.filter((employee) => String(employee.status).toLowerCase() === "active").length;
        const absentEmployees = employees.length - activeEmployees;
        const budgetUsed = budget.total_spent ?? 0;
        const budgetTotal = budget.total_budget ?? 0;
        const budgetPct = budget.utilisation_pct ?? 0;

        setText("absent-count", integer.format(absentEmployees));
        setText("absent-desc", `${integer.format(absentEmployees)} employees`);
        setText("budget-pct", `${budgetPct}%`);
        setText("budget-summary", `${money.format(budgetUsed)} of ${money.format(budgetTotal)} utilized`);
        setText("budget-total", money.format(budgetTotal));
        setText("budget-used", money.format(budgetUsed));
        setText("active-count", integer.format(activeEmployees));
        setText("active-desc", `${integer.format(activeEmployees)} employees`);

        document.getElementById("loading").hidden = true;
        document.getElementById("dashboard").hidden = false;
      } catch (error) {
        const errorBox = document.getElementById("error");
        errorBox.hidden = false;
        errorBox.textContent = "Could not reach backend. Make sure uvicorn is running.";

        document.getElementById("loading").hidden = true;
        document.getElementById("dashboard").hidden = false;
        console.error(error);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
